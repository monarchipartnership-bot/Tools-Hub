<style>

  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap");
  :root{
    --bgA:#160616; --bgB:#2a0a2a; --bgC:#3a0f38;
    --gold:#E8C079; --mag:#C24BC2; --plum:#421342;
    --text:#f5eef5; --mut:#c2a6c2; --line:rgba(255,255,255,.12);
    --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.02);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #page{font-family:"Inter",sans-serif;color:var(--text);min-height:100vh;position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 15% 0%, var(--bgC) 0%, var(--bgB) 40%, var(--bgA) 100%);
    padding:22px clamp(20px,5vw,64px) 48px}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
  .g1{width:520px;height:520px;background:var(--mag);top:-140px;right:-80px;opacity:.32;animation:floatG1 28s ease-in-out infinite}
  .g2{width:460px;height:460px;background:var(--gold);bottom:-160px;left:-100px;opacity:.16;animation:floatG2 34s ease-in-out infinite}
  #page>*:not(.glow){position:relative;z-index:1}

  @keyframes floatG1{
    0%{transform:translate(0,0) scale(1)}
    25%{transform:translate(-70px,50px) scale(1.08)}
    50%{transform:translate(30px,90px) scale(0.96)}
    75%{transform:translate(70px,20px) scale(1.04)}
    100%{transform:translate(0,0) scale(1)}
  }
  @keyframes floatG2{
    0%{transform:translate(0,0) scale(1)}
    30%{transform:translate(60px,-40px) scale(1.06)}
    60%{transform:translate(-40px,-80px) scale(0.94)}
    100%{transform:translate(0,0) scale(1)}
  }
  @media (prefers-reduced-motion: reduce){
    .glow,.card{animation:none!important}
  }

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
  .logo svg{height:34px;width:auto;display:block}
  .tag{font-family:"Montserrat",sans-serif;font-weight:600;font-size:11px;letter-spacing:2.5px;color:var(--mut);
    border:1px solid var(--line);padding:7px 13px;border-radius:20px;white-space:nowrap}

  /* breadcrumb */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px;font-family:"Inter",sans-serif;font-size:12.5px;color:var(--mut)}
  .crumbs a{color:var(--mut);text-decoration:none;transition:color .15s}
  .crumbs a:hover{color:var(--gold)}
  .crumbs .sep{color:var(--line);opacity:.9}
  .crumbs .cur{font-family:"Montserrat",sans-serif;color:var(--gold);font-weight:600}

  .back{display:inline-flex;align-items:center;gap:6px;font-family:"Inter",sans-serif;font-weight:600;font-size:12px;letter-spacing:.5px;
    color:var(--mut);text-decoration:none;margin-bottom:18px;transition:color .15s}
  .back:hover{color:var(--gold)}

  .hero{max-width:640px;margin-bottom:32px}
  .kicker{font-family:"Montserrat",sans-serif;font-weight:600;font-size:12px;letter-spacing:3px;color:var(--gold);margin-bottom:16px}
  .hero h1{font-family:"Montserrat",sans-serif;font-size:clamp(40px,8vw,68px);font-weight:700;letter-spacing:-2px;line-height:1;margin-bottom:16px}
  .hero p{font-family:"Inter",sans-serif;font-size:clamp(15px,2.4vw,18px);color:var(--mut);line-height:1.55;max-width:520px}

  .subhero{max-width:640px;margin-bottom:28px}
  .subhero h2{font-family:"Montserrat",sans-serif;font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-bottom:10px}
  .subhero p{font-family:"Inter",sans-serif;font-size:14.5px;color:var(--mut);line-height:1.55;max-width:520px}

  .dept{margin-bottom:clamp(30px,5vw,44px)}
  .dept-head{display:flex;align-items:center;gap:18px;margin-bottom:22px;padding:18px 22px;border-radius:16px;
    background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);
    border-left:3px solid var(--mag);position:relative;overflow:hidden}
  .dept-head::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 140% at 0% 50%, rgba(194,75,194,.10), transparent 65%)}
  .dept-head.accent-gold{border-left-color:var(--gold)}
  .dept-head.accent-gold::before{background:radial-gradient(70% 140% at 0% 50%, rgba(232,192,121,.10), transparent 65%)}
  .dept-ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;
    background:linear-gradient(160deg,rgba(194,75,194,.30),rgba(66,19,66,.45));border:1px solid var(--line);position:relative;z-index:1}
  .dept-head.accent-gold .dept-ic{background:linear-gradient(160deg,rgba(232,192,121,.28),rgba(66,19,66,.45))}
  .dept-ic svg{width:25px;height:25px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dept-titles{flex:1;position:relative;z-index:1}
  .dept-kicker{font-family:"Montserrat",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
  .dept-num{font-family:"Montserrat",sans-serif;font-size:13px;color:var(--gold);font-weight:700}
  .dept-name{font-family:"Montserrat",sans-serif;font-size:clamp(18px,3vw,23px);font-weight:600;letter-spacing:-.3px}
  .dept-count{position:relative;z-index:1;font-family:"Montserrat",sans-serif;font-weight:600;font-size:11px;color:var(--mut);
    letter-spacing:1.5px;border:1px solid var(--line);padding:6px 13px;border-radius:20px;white-space:nowrap;flex:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
  .card{position:relative;display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit;cursor:pointer;
    background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;
    padding:22px;overflow:hidden;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    animation:cardPulse 5.5s ease-in-out infinite}
  .card:nth-child(4n+1){animation-delay:0s}
  .card:nth-child(4n+2){animation-delay:1.3s}
  .card:nth-child(4n+3){animation-delay:2.6s}
  .card:nth-child(4n+4){animation-delay:3.9s}
  .card::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .22s;
    background:radial-gradient(120% 90% at 100% 0%, rgba(232,192,121,.14), transparent 60%)}
  .card:hover{transform:translateY(-5px);border-color:rgba(232,192,121,.55);animation-play-state:paused;
    box-shadow:0 22px 50px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(232,192,121,.25)}
  .card:hover::after{opacity:1}
  @keyframes cardPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(232,192,121,0)}
    50%{box-shadow:0 0 26px 3px rgba(232,192,121,.10)}
  }
  .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
    background:linear-gradient(160deg,rgba(194,75,194,.28),rgba(66,19,66,.4));border:1px solid var(--line)}
  .ic svg{width:23px;height:23px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .c-body{flex:1}
  .c-name{font-family:"Montserrat",sans-serif;font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:6px}
  .c-desc{font-family:"Inter",sans-serif;font-size:13.5px;color:var(--mut);line-height:1.5}
  .c-go{display:flex;align-items:center;gap:8px;font-family:"Montserrat",sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;color:var(--gold);
    text-transform:uppercase}
  .c-go .arr{transition:transform .22s ease}
  .card:hover .c-go .arr{transform:translateX(5px)}

  .foot{margin-top:20px;font-family:"Inter",sans-serif;font-size:10.5px;letter-spacing:1px;color:var(--mut);opacity:.7}

  .card.is-soon{opacity:.72}
  .card.is-soon:hover{opacity:.92}
  .soon-badge{position:absolute;top:16px;right:16px;font-family:"Montserrat",sans-serif;font-weight:600;font-size:9.5px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--gold);border:1px solid rgba(232,192,121,.4);background:rgba(232,192,121,.08);
    padding:4px 9px;border-radius:20px}

  /* placeholder leaf view */
  .placeholder{max-width:640px;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:18px;padding:36px 30px;margin-top:6px}
  .placeholder .ph-badge{display:inline-block;font-family:"Montserrat",sans-serif;font-weight:600;font-size:9.5px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--gold);border:1px solid rgba(232,192,121,.4);background:rgba(232,192,121,.08);
    padding:4px 9px;border-radius:20px;margin-bottom:16px}
  .placeholder h3{font-family:"Montserrat",sans-serif;font-size:22px;font-weight:600;margin-bottom:10px}
  .placeholder p{font-family:"Inter",sans-serif;font-size:14px;color:var(--mut);line-height:1.6;margin-bottom:20px}
  .placeholder a.legacy{display:inline-flex;align-items:center;gap:8px;font-family:"Inter",sans-serif;font-weight:600;font-size:12px;
    letter-spacing:1px;color:var(--gold);text-decoration:none;border:1px solid rgba(232,192,121,.4);padding:11px 18px;border-radius:10px;
    transition:background .15s}
  .placeholder a.legacy:hover{background:rgba(232,192,121,.1)}

  @media(max-width:520px){
    .grid{grid-template-columns:1fr}
    .tag{display:none}
  }

</style>
</head>

  <div class="glow g1"></div>

  <header class="top">
    <a class="logo" href="index.html" id="logo" style="text-decoration:none"></a>
    <div class="tag">INTERNAL TOOLS</div>
  </header>

  <nav class="crumbs" id="crumbs"></nav>

  <main id="view"></main>

  <footer class="foot">Mon'Archi &middot; internal tools hub</footer>
</div>

  /* ===== icons ===== */
  const IC={
    daily:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
    week:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 14l2.5 2.5L12 13l3 4"/></svg>',
    month:'<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 16l2-2 2 2 3-4"/></svg>',
    annual:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/><path d="M12 12L6.5 17.5"/></svg>',
    reports:'<svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M2 13l10 5 10-5"/></svg>',
    portfolio:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4-4 4 4 3-3 4 4"/><circle cx="8.5" cy="9" r="1.4"/></svg>',
    clients:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 20a5.3 5.3 0 0 0-3-4.8"/></svg>',
    create:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    compare:'<svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>',
    history:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>',
    deptSales:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    deptPM:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/><path d="M8 11h8M8 15h5"/></svg>'
  };

  /* ===== data ===== */
  const DEPTS={
    sales:{ label:"Sales Department", icon:IC.deptSales, accent:"mag", items:[
      { key:"reports",   name:"Reports",          desc:"Daily, weekly, monthly & annual performance reporting.", icon:IC.reports,   type:"category" },
      { key:"portfolio", name:"Portfolio Studio",  desc:"Upwork catalog & portfolio image maker.",                 icon:IC.portfolio, type:"link", href:"portfolio_studio.html" }
    ]},
    pm:{ label:"Project Managers Department", icon:IC.deptPM, accent:"gold", items:[
      { key:"clients", name:"Clients Report", desc:"Client-facing reporting for PMs.", icon:IC.clients, type:"link", href:"clients_report.html" }
    ]}
  };

  const REPORT_TYPES={
    daily:   { name:"Daily Report",   desc:"Log today's work, clients touched, and tomorrow's plan.", icon:IC.daily,  actions:["create","history"], legacy:{create:"daily_report.html"}, pages:{create:"daily_report.html", history:"daily_history.html"} },
    weekly:  { name:"Weekly Report",  desc:"Build and save the team's weekly performance report.",     icon:IC.week,   actions:["create","compare","history"], legacy:{create:"upwork_weekly_presentation.html"}, pages:{create:"weekly.html", compare:"weekly_compare.html", history:"weekly_history.html"} },
    monthly: { name:"Monthly Report", desc:"Monthly results & summary analytics across all weeks.",     icon:IC.month,  actions:["create","compare","history"], legacy:{create:"upwork_monthly_report.html","compare":"upwork_monthly_report.html"} },
    annual:  { name:"Annual Report",  desc:"Full-year results & summary analytics across all months.", icon:IC.annual, actions:["create","compare","history"] }
  };

  const ACTIONS={
    create:  { name:"Create New Report", desc:"Start a new report and fill in this period's data.",    icon:IC.create },
    compare: { name:"Compare",           desc:"Compare two or more periods side by side.",              icon:IC.compare },
    history: { name:"History",           desc:"Browse and reopen previously saved reports.",            icon:IC.history }
  };

  const root=document.getElementById("view");
  const crumbsEl=document.getElementById("crumbs");

  function cardHTML(key,name,desc,icon,soon){
    return '<a class="card'+(soon?' is-soon':'')+'" href="#'+key+'">'+
      (soon?'<span class="soon-badge">In progress</span>':'')+
      '<div class="ic">'+icon+'</div>'+
      '<div class="c-body"><div class="c-name">'+name+'</div><div class="c-desc">'+desc+'</div></div>'+
      '<div class="c-go">Open <span class="arr">&#8594;</span></div>'+
    '</a>';
  }

  function linkCardHTML(href,name,desc,icon){
    return '<a class="card" href="'+href+'">'+
      '<div class="ic">'+icon+'</div>'+
      '<div class="c-body"><div class="c-name">'+name+'</div><div class="c-desc">'+desc+'</div></div>'+
      '<div class="c-go">Open <span class="arr">&#8594;</span></div>'+
    '</a>';
  }

  function renderCrumbs(trail){
    // trail: array of {label, hash} ; last one is current (not a link)
    let html='<a href="#/">Tools Hub</a>';
    trail.forEach((t,i)=>{
      html+='<span class="sep">/</span>';
      if(i===trail.length-1){ html+='<span class="cur">'+t.label+'</span>'; }
      else{ html+='<a href="'+t.hash+'">'+t.label+'</a>'; }
    });
    crumbsEl.innerHTML = trail.length ? html : '';
  }

  function renderRoot(){
    renderCrumbs([]);
    let html='<section class="hero">'+
      '<div class="kicker">MON\'ARCHI &middot; OPERATIONS</div>'+
      '<h1>Tools Hub</h1>'+
      '<p>Привіт, команда Mon&#39;Archi! Тут зібрані всі внутрішні студії та інструменти для звітності агентства &mdash; оберіть відділ і йдіть далі до потрібного інструменту.</p>'+
    '</section>';
    let i=0;
    for(const dk in DEPTS){
      i++;
      const d=DEPTS[dk];
      const n=d.items.length;
      html+='<section class="dept"><div class="dept-head accent-'+d.accent+'">'+
        '<div class="dept-ic">'+d.icon+'</div>'+
        '<div class="dept-titles">'+
          '<div class="dept-kicker">DEPARTMENT 0'+i+'</div>'+
          '<div class="dept-name">'+d.label+'</div>'+
        '</div>'+
        '<div class="dept-count">'+n+' ITEM'+(n>1?'S':'')+'</div>'+
      '</div><div class="grid">';
      d.items.forEach(it=>{
        html += it.type==='link'
          ? linkCardHTML(it.href,it.name,it.desc,it.icon)
          : cardHTML('/'+dk+'/'+it.key,it.name,it.desc,it.icon,false);
      });
      html+='</div></section>';
    }
    root.innerHTML=html;
  }

  function renderDept(dk){
    const d=DEPTS[dk];
    if(!d){ location.hash='#/'; return; }
    renderCrumbs([{label:d.label,hash:''}]);
    let html='<section class="subhero"><h2>'+d.label+'</h2><p>Оберіть категорію інструментів цього відділу.</p></section>';
    html+='<div class="grid">';
    d.items.forEach(it=>{
      html += it.type==='link'
        ? linkCardHTML(it.href,it.name,it.desc,it.icon)
        : cardHTML('/'+dk+'/'+it.key,it.name,it.desc,it.icon,false);
    });
    html+='</div>';
    root.innerHTML=html;
  }

  function renderCategory(dk,ck){
    const d=DEPTS[dk];
    if(!d){ location.hash='#/'; return; }
    if(ck!=='reports'){ location.hash='#/'+dk; return; }
    renderCrumbs([{label:d.label,hash:'#/'+dk},{label:'Reports',hash:''}]);
    let html='<section class="subhero"><h2>Reports</h2><p>Оберіть тип звіту.</p></section>';
    html+='<div class="grid">';
    for(const tk in REPORT_TYPES){
      const t=REPORT_TYPES[tk];
      html+=cardHTML('/'+dk+'/reports/'+tk,t.name,t.desc,t.icon,false);
    }
    html+='</div>';
    root.innerHTML=html;
  }

  function renderType(dk,ck,tk){
    const d=DEPTS[dk], t=REPORT_TYPES[tk];
    if(!d||ck!=='reports'||!t){ location.hash='#/'+dk+'/reports'; return; }
    renderCrumbs([{label:d.label,hash:'#/'+dk},{label:'Reports',hash:'#/'+dk+'/reports'},{label:t.name,hash:''}]);
    let html='<section class="subhero"><h2>'+t.name+'</h2><p>'+t.desc+'</p></section>';
    html+='<div class="grid">';
    t.actions.forEach(ak=>{
      const a=ACTIONS[ak];
      html+=cardHTML('/'+dk+'/reports/'+tk+'/'+ak,a.name,a.desc,a.icon,false);
    });
    html+='</div>';
    root.innerHTML=html;
  }

  function renderAction(dk,ck,tk,ak){
    const d=DEPTS[dk], t=REPORT_TYPES[tk], a=ACTIONS[ak];
    if(!d||ck!=='reports'||!t||!a){ location.hash='#/'+dk+'/reports'; return; }
    const realPage = t.pages && t.pages[ak];
    if(realPage){ location.href=realPage; return; }
    renderCrumbs([{label:d.label,hash:'#/'+dk},{label:'Reports',hash:'#/'+dk+'/reports'},{label:t.name,hash:'#/'+dk+'/reports/'+tk},{label:a.name,hash:''}]);
    let html='<section class="subhero"><h2>'+t.name+' &mdash; '+a.name+'</h2></section>';
    const legacyHref = t.legacy && t.legacy[ak];
    html+='<div class="placeholder">'+
      '<span class="ph-badge">In development</span>'+
      '<h3>'+a.name+'</h3>'+
      '<p>'+a.desc+' Цей розділ ще будується &mdash; сюди перенесемо логіку та формули з поточного інструменту, зберігаючи дані у спільній базі.</p>'+
      (legacyHref ? '<a class="legacy" href="'+legacyHref+'">Відкрити поточну версію &#8594;</a>' : '')+
    '</div>';
    root.innerHTML=html;
  }

  function route(){
    const raw=location.hash.replace(/^#\/?/,'');
    const parts=raw.split('/').filter(Boolean);
    if(parts.length===0){ renderRoot(); return; }
    if(parts.length===1){ renderDept(parts[0]); return; }
    if(parts.length===2){ renderCategory(parts[0],parts[1]); return; }
    if(parts.length===3){ renderType(parts[0],parts[1],parts[2]); return; }
    if(parts.length===4){ renderAction(parts[0],parts[1],parts[2],parts[3]); return; }
    location.hash='#/';
  }

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
