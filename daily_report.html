@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap");
:root{
  --ink:#241429; --mut:rgba(36,20,41,0.55); --mut2:rgba(36,20,41,0.35);
  --purple:#661466; --purple2:#883288; --purple3:#B544B5;
  --gold:#A6742A; --line:rgba(102,20,102,0.14); --card:#FBF8FD;
  --done:#1A9C6B; --clients:#883288; --plans:#B8860B;
  --li:#0A66C2; --uw:#108A00; --other:#6B6470;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter",sans-serif;background:#EFE9F4;color:var(--ink);min-height:100vh;}
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(102,20,102,0.06);}
.tb-logo{width:26px;height:26px;flex-shrink:0;}
.tb-ttl{font-family:"Montserrat",sans-serif;font-weight:700;font-size:0.86rem;color:var(--purple);letter-spacing:-0.01em;}
.tb-sp{flex:1;}
.btn{font-family:"Inter",sans-serif;font-weight:600;font-size:0.78rem;padding:8px 15px;border-radius:7px;cursor:pointer;border:none;white-space:nowrap;}
.btn-p{background:linear-gradient(135deg,#B544B5,#661466);color:#fff;}
.btn-p:hover{background:linear-gradient(135deg,#C955C9,#7A1B7A);}
.btn-g{background:rgba(102,20,102,0.07);color:#661466;}
.btn-g:hover{background:rgba(102,20,102,0.14);}
.page-wrap{display:flex;justify-content:center;padding:30px 20px 60px;}
.page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 12px 44px rgba(60,20,70,0.16);padding:16mm 15mm;position:relative;}
.rpt-top{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.rpt-top svg{width:32px;height:32px;flex-shrink:0;}
.rpt-ttl{font-family:"Montserrat",sans-serif;font-weight:800;font-size:1.55rem;color:var(--purple);letter-spacing:-0.02em;}
.rpt-sub{font-family:"Inter",sans-serif;font-size:0.68rem;color:var(--mut2);letter-spacing:0.14em;text-transform:uppercase;margin:2px 0 14px 42px;}
.rpt-meta{display:flex;gap:30px;padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--purple);}
.rpt-field{display:flex;flex-direction:column;gap:3px;}
.rpt-field label{font-family:"Inter",sans-serif;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--mut);}
.rpt-field input{font-family:"Inter",sans-serif;font-size:0.92rem;font-weight:600;color:var(--ink);border:none;background:transparent;outline:none;padding:2px 0;border-bottom:1px dashed transparent;min-width:140px;}
.rpt-field input:focus{border-bottom-color:var(--purple2);}
.section{margin-bottom:24px;}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.sec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sec-name{font-family:"Montserrat",sans-serif;font-weight:700;font-size:0.86rem;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink);}
.sec-line{flex:1;height:1px;background:var(--line);}
.sec-count{font-family:"Inter",sans-serif;font-size:0.66rem;font-weight:600;color:var(--mut);letter-spacing:0.03em;}
.items{display:flex;flex-direction:column;gap:9px;margin-bottom:11px;}
.item-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;position:relative;}
.item-idx{position:absolute;left:11px;top:12px;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-weight:700;font-size:0.64rem;color:#fff;}
.item-box textarea{width:100%;display:block;border:none;background:transparent;outline:none;resize:none;overflow:hidden;font-family:"Inter",sans-serif;font-size:0.85rem;line-height:1.58;color:var(--ink);min-height:20px;}
.item-box textarea::placeholder{color:var(--mut2);}
.del-btn{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;border:none;background:rgba(192,57,43,0.09);color:#C0392B;font-size:0.72rem;cursor:pointer;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;line-height:1;}
.item-box:hover .del-btn{opacity:1;}
.client-hdr{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.pill{font-family:"Inter",sans-serif;font-size:0.64rem;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;letter-spacing:0.02em;opacity:0.5;transition:all .15s;}
.pill:hover{opacity:0.85;}
.pill.active{opacity:1;}
.pill.active.src-linkedin{background:rgba(10,102,194,0.11);border-color:rgba(10,102,194,0.4);color:var(--li);}
.pill.active.src-upwork{background:rgba(16,138,0,0.11);border-color:rgba(16,138,0,0.4);color:var(--uw);}
.pill.active.src-other{background:rgba(107,100,112,0.11);border-color:rgba(107,100,112,0.4);color:var(--other);}
.add-btn{align-self:flex-start;font-family:"Inter",sans-serif;font-weight:600;font-size:0.78rem;color:var(--purple2);background:rgba(102,20,102,0.05);border:1.5px dashed rgba(102,20,102,0.28);border-radius:10px;padding:9px 17px;cursor:pointer;}
.add-btn:hover{background:rgba(102,20,102,0.11);}
.empty-hint{font-family:"Inter",sans-serif;font-size:0.78rem;color:var(--mut2);font-style:italic;padding:2px 2px 9px;}
.rpt-ftr{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-family:"Inter",sans-serif;font-size:0.64rem;color:var(--mut2);text-align:center;letter-spacing:0.05em;text-transform:uppercase;}
body.capturing .add-btn,body.capturing .del-btn{display:none!important;}
body.capturing .pill:not(.active){display:none!important;}
body.capturing .page{box-shadow:none!important;}
@media print{
  @page{size:210mm 297mm;margin:0;}
  html,body{background:#fff!important;}
  .toolbar,.page-wrap{padding:0!important;}
  .toolbar{display:none!important;}
  .page-wrap{display:block!important;background:#fff!important;}
  .page{box-shadow:none!important;margin:0 auto!important;width:210mm!important;min-height:297mm!important;}
  .add-btn,.del-btn{display:none!important;}
  .pill:not(.active){display:none!important;}
  .item-box{page-break-inside:avoid;}
  .section{page-break-inside:avoid;}
}

</style>
</head>

<script>
var STATE = { date:'', name:'', done:[], clients:[], plans:[] };
var nextId = 1;
var SEC_COLOR = { done:'#1A9C6B', clients:'#883288', plans:'#B8860B' };
var SEC_LABEL = { done:'пункт', clients:'клієнт', plans:'пункт' };
var SOURCES = ['LinkedIn','Upwork','Other'];

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function autoH(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

function pad2(n){ return n<10?'0'+n:''+n; }
function todayStr(){
  var d=new Date();
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear();
}

function markDirty(){ STATE.date = document.getElementById('rpt-date').value; STATE.name = document.getElementById('rpt-name').value; }

function updateCount(section){
  var n = STATE[section].length;
  var word = n===1 ? SEC_LABEL[section] : (SEC_LABEL[section]==='клієнт' ? 'клієнти' : 'пунктів');
  document.getElementById('cnt-'+section).textContent = n + ' ' + word;
  document.getElementById('empty-'+section).style.display = n ? 'none' : 'block';
}

function pillsHTML(section, id, active){
  if(section !== 'clients') return '';
  return '<div class="client-hdr">' + SOURCES.map(function(s){
    var cls = 'src-' + s.toLowerCase();
    return '<button type="button" class="pill '+cls+(s===active?' active':'')+'" onclick="setSource(\''+section+'\','+id+',\''+s+'\',this)">'+s+'</button>';
  }).join('') + '</div>';
}

function addItem(section, presetText, presetSource){
  var id = nextId++;
  var item = { id:id, text: presetText||'' };
  if(section === 'clients') item.source = presetSource || 'LinkedIn';
  STATE[section].push(item);
  renderNewItem(section, item);
  updateCount(section);
  return item;
}

function renderNewItem(section, item){
  var container = document.getElementById('items-'+section);
  var html = '<div class="item-box" data-id="'+item.id+'">'
    + '<div class="item-idx" style="background:'+SEC_COLOR[section]+'">'+STATE[section].length+'</div>'
    + '<button type="button" class="del-btn" title="Видалити">&times;</button>'
    + pillsHTML(section, item.id, item.source)
    + '<textarea placeholder="Введіть текст..." rows="1">'+esc(item.text)+'</textarea>'
    + '</div>';
  container.insertAdjacentHTML('beforeend', html);
  var box = container.lastElementChild;
  var ta = box.querySelector('textarea');
  ta.value = item.text;
  autoH(ta);
  ta.addEventListener('input', function(){ item.text = ta.value; autoH(ta); });
  box.querySelector('.del-btn').addEventListener('click', function(){ removeItem(section, item.id, box); });
}

function removeItem(section, id, box){
  STATE[section] = STATE[section].filter(function(it){ return it.id !== id; });
  box.remove();
  renumber(section);
  updateCount(section);
}

function renumber(section){
  var container = document.getElementById('items-'+section);
  var boxes = container.querySelectorAll('.item-box');
  for(var i=0;i<boxes.length;i++){
    var idx = boxes[i].querySelector('.item-idx');
    if(idx) idx.textContent = (i+1);
  }
}

function setSource(section, id, source, btn){
  var item = STATE[section].filter(function(it){ return it.id === id; })[0];
  if(!item) return;
  item.source = source;
  var hdr = btn.parentElement;
  var pills = hdr.querySelectorAll('.pill');
  pills.forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
}

function exportPDF(){
  window.print();
}

function exportJPEG(btn){
  var label = btn ? btn.textContent : '';
  if(btn) btn.textContent = '...';
  document.body.classList.add('capturing');
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(function(){
    return html2canvas(document.getElementById('page'), {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true
    });
  }).then(function(canvas){
    var link = document.createElement('a');
    var datePart = (STATE.date||'').replace(/[^0-9]/g,'_') || 'report';
    link.download = 'daily_report_' + datePart + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  }).catch(function(err){
    alert('Не вдалося створити зображення: ' + err.message);
  }).finally(function(){
    document.body.classList.remove('capturing');
    if(btn) btn.textContent = label;
  });
}

function saveJSON(){
  markDirty();
  var payload = { _type:'monarchi_daily_report', _version:1, date:STATE.date, name:STATE.name,
    done:STATE.done, clients:STATE.clients, plans:STATE.plans };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var datePart = (STATE.date||'').replace(/[^0-9]/g,'_') || 'report';
  a.download = 'daily_report_' + datePart + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearAll(){
  ['done','clients','plans'].forEach(function(section){
    STATE[section] = [];
    document.getElementById('items-'+section).innerHTML = '';
    updateCount(section);
  });
}

function importJSON(input){
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(d._type !== 'monarchi_daily_report'){ alert('Неправильний формат файлу'); return; }
      clearAll();
      document.getElementById('rpt-date').value = d.date || '';
      document.getElementById('rpt-name').value = d.name || '';
      markDirty();
      (d.done||[]).forEach(function(it){ addItem('done', it.text); });
      (d.clients||[]).forEach(function(it){ addItem('clients', it.text, it.source); });
      (d.plans||[]).forEach(function(it){ addItem('plans', it.text); });
    }catch(err){
      alert('Помилка: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

document.getElementById('rpt-date').value = todayStr();
markDirty();
updateCount('done'); updateCount('clients'); updateCount('plans');
addItem('done'); addItem('clients'); addItem('plans');

</script>
</body>
</html>
